<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Krypta</title>
    <link rel="stylesheet" href="../assets/app.css">
</head>
<body>

    <main class="login-container">
        <h1>Crear cuenta</h1>
        <p>Regístrate en Krypta</p>

        <form id="registerForm">
            <label for="email">Correo electrónico</label>
            <input type="email" id="email" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" minlength="8" required>

            <label for="confirmPassword">Repetir contraseña</label>
            <input type="password" id="confirmPassword" minlength="8" required>

            <button type="submit">Registrarse</button>
        </form>

        <p id="message"></p>

        <p>¿Ya tienes una cuenta?
            <a href="login.html">Inicia sesión</a>
        </p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>

    <script>
        document.getElementById("registerForm").addEventListener("submit", async function(event) {
            event.preventDefault();

            var email = document.getElementById("email").value;
            var password = document.getElementById("password").value;
            var confirmPassword = document.getElementById("confirmPassword").value;
            var message = document.getElementById("message");

            if (password !== confirmPassword) {
                message.textContent = "Las contraseñas no coinciden.";
                return;
            }

            var result = await supabaseClient.auth.signUp({
                email: email,
                password: password
            });

            if (result.error) {
                message.textContent = "Error: " + result.error.message;
                return;
            }

            message.textContent = "Cuenta creada. Comprueba tu correo si Supabase solicita confirmación.";
        });
    </script>

</body>
</html>
