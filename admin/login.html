<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Acceso interno | Krypta</title>

<link rel="stylesheet" href="../assets/app.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>

</head>

<body>

<div class="demo">Krypta - Sistema de acceso seguro</div>

<div class="auth">
<div class="card">

<div class="logo">Krypta</div>

<h1>Acceso interno</h1>
<p>Identificación segura de usuarios.</p>

<form id="loginForm">

    <label>Correo electrónico</label>
    <input id="email" type="email" required>

    <label>Contraseña</label>
    <input id="pw" type="password" required>

    <button class="btn" type="submit">Entrar</button>

</form>

<p>¿No tienes una cuenta?
    <a href="register.html">Regístrate aquí</a>
</p>

<div id="error" role="alert"></div>

</div>
</div>

<script>

document.getElementById("loginForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    var email = document.getElementById("email").value.trim();
    var password = document.getElementById("pw").value;
    var error = document.getElementById("error");

    error.textContent = "Comprobando datos...";

    var result = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (result.error) {
        error.textContent = "Error: " + result.error.message;
        return;
    }

    location.href = "panel.html";

});

</script>

</body>
</html>
